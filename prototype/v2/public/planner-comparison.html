<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Degree planner comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f4f5f7; color: #172b4d; font: 14px system-ui, sans-serif; }
      main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: 100vh; }
      section { display: flex; flex-direction: column; min-width: 0; }
      section + section { border-left: 1px solid #dfe1e5; }
      header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 12px 16px; background: white; border-bottom: 1px solid #dfe1e5; }
      h1, h2 { margin: 0; font-size: 14px; font-weight: 600; }
      a { color: #0052cc; font-size: 12px; text-decoration: none; }
      a:hover { text-decoration: underline; }
      iframe { display: block; width: 100%; flex: 1; min-height: 0; border: 0; background: white; }
    </style>
  </head>
  <body>
    <main aria-label="Degree planner prototypes side by side">
      <section aria-label="V2 prototype">
        <header><h1>V2 · Course palette + degree previewer</h1><a href="/degree-planner" target="_blank" rel="noopener noreferrer">Open separately ↗</a></header>
        <iframe title="V2 degree planner" src="/degree-planner"></iframe>
      </section>
      <section aria-label="V1 prototype">
        <header><h2>V1 · Roadmap + planner</h2><a id="original-link" href="http://localhost:5173/" target="_blank" rel="noopener noreferrer">Open separately ↗</a></header>
        <iframe id="original-frame" title="V1 degree planner" src="http://localhost:5173/"></iframe>
      </section>
    </main>
    <script>
      const originalUrl = new URL(window.location.href);
      originalUrl.port = '5173';
      originalUrl.pathname = '/';
      originalUrl.search = '';
      originalUrl.hash = '';
      document.getElementById('original-link').href = originalUrl.href;
      document.getElementById('original-frame').src = originalUrl.href;
    </script>
  </body>
</html>
